name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar datos de aseos"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p site/data site/languages
          cp index.html site/index.html
          cp styles.css site/styles.css
          cp themes.js site/themes.js
          cp app.js site/app.js
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          cp version.json site/version.json
          cp icon-192.png site/icon-192.png
          cp icon-512.png site/icon-512.png
          cp data/aseos.json site/data/aseos.json
          cp languages/*.json site/languages/

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
